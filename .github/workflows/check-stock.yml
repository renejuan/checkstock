name: Check Weverse stock

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weverse-stock-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::jsonlite

      - name: Check availability
        id: stock
        env:
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
        run: Rscript scripts/check_stock.R

      - name: Create a GitHub Issue for a restock
        if: steps.stock.outputs.available_transition == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
        run: |
          gh issue create \
            --title "Weverse restock detected" \
            --body "The stock checker detected that the item may be available: ${PRODUCT_URL}"

      - name: Save changed stock state
        run: |
          if [ -z "$(git status --porcelain -- data/stock-status.json)" ]; then
            echo "No stock-state change to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-status.json
          git commit -m "chore: record Weverse stock state"
          git push
